<html lang="en">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c5a059" />
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="CAD CUTZ & ICE - Premium Grooming & Elite Barbering Management">

    <link rel="manifest" href="/manifest.json" />
    
    <title>CAD CUTZ & ICE</title>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          // In dev (Vite), unregister any stale SW to prevent caching issues.
          // In production, register SW so the browser can trigger beforeinstallprompt.
          var isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
          if (isDev) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            });
          } else {
            navigator.serviceWorker.register('/sw.js').catch(function () {});
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
